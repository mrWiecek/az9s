[package]
name = "c9s-aws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
c9s-exec = { path = "../c9s-exec" }
chrono = { workspace = true }
# SigV4 signing (HMAC-SHA256, SHA-256); already in the tree through rustls.
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }

[dev-dependencies]
c9s-azure = { path = "../c9s-azure", features = ["test-util"] }
tempfile = "3.8"
tokio = { workspace = true, features = ["test-util"] }

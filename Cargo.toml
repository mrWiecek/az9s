[workspace]
resolver = "2"
members = [
    "crates/az9s",
    "crates/az9s-core",
    "crates/az9s-azure",
    "crates/az9s-tui",
]

[workspace.package]
version = "0.16.0"
edition = "2021"
rust-version = "1.88"
authors = ["az9s contributors"]
license = "Apache-2.0"
repository = "https://github.com/mrWiecek/az9s"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# TUI
ratatui = "0.26"
crossterm = "0.27"

# Azure SDK. Default features are off so nothing links the system OpenSSL:
# TLS comes from rustls, which builds anywhere (WSL, minimal containers)
# without libssl-dev or pkg-config.
azure_core = { version = "0.19", default-features = false, features = ["enable_reqwest_rustls"] }
azure_identity = { version = "0.19", default-features = false, features = ["enable_reqwest_rustls", "development", "old_azure_cli"] }
azure_mgmt_resources = { version = "0.19", default-features = false, features = ["enable_reqwest_rustls", "default_tag"] }

# Data & serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
directories = "5.0"

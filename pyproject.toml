[project]
name = "aztui-builder"
version = "0.1.0"
description = "LangGraph-based multi-agent orchestrator for building Rust + Ratatui applications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "anthropic>=0.55.0",
  "langchain>=0.3.27",
  "langchain-anthropic>=0.3.17",
  "langchain-community>=0.3.27",
  "langchain-core>=0.3.72",
  "langgraph>=1.0.2",
  "langgraph-checkpoint-sqlite>=2.0.11",
  "langsmith>=0.4.10",
  "pydantic>=2.11.7",
  "python-dotenv>=1.1.1",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
]

[project.scripts]
aztui-builder = "aztui_builder.main:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aztui_builder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
